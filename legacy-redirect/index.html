<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="robots" content="noindex, follow" />
    <meta
      name="description"
      content="ระบบ Nutalig ได้ย้ายไปยัง app.nutalig.com กรุณาเข้าใช้งานผ่านเว็บไซต์ใหม่"
    />
    <link rel="canonical" href="https://app.nutalig.com/" />
    <link rel="icon" type="image/jpeg" href="https://app.nutalig.com/logo_nutalig.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <title>Nutalig ย้ายไปยังระบบใหม่แล้ว</title>
    <style>
      :root {
        color-scheme: light;
        font-family: 'Noto Sans Thai', 'Leelawadee UI', Tahoma, Arial, sans-serif;
        color: #17212b;
        background: #f5f8f7;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background: radial-gradient(circle at 8% 8%, rgba(250, 204, 21, 0.13), transparent 28rem),
          radial-gradient(circle at 92% 88%, rgba(13, 148, 136, 0.13), transparent 30rem), #f5f8f7;
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
      }

      .card {
        position: relative;
        width: min(100%, 720px);
        overflow: hidden;
        padding: clamp(32px, 7vw, 64px);
        border: 1px solid rgba(15, 118, 110, 0.14);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 28px 80px rgba(15, 42, 39, 0.12);
        text-align: center;
      }

      .card::before {
        content: '';
        position: absolute;
        inset: 0 0 auto;
        height: 6px;
        background: linear-gradient(90deg, #eab308, #0d9488, #0f766e);
      }

      .brand {
        width: fit-content;
        margin: 0 auto 32px;
      }

      .brand img {
        display: block;
        width: clamp(112px, 24vw, 150px);
        height: auto;
        border-radius: 16px;
      }

      .status {
        width: fit-content;
        margin: 0 auto 18px;
        padding: 7px 13px;
        border-radius: 999px;
        background: #ecfdf5;
        color: #047857;
        font-size: 14px;
        font-weight: 700;
      }

      h1 {
        margin: 0;
        color: #102a28;
        font-size: clamp(30px, 6vw, 48px);
        line-height: 1.2;
        letter-spacing: -0.03em;
      }

      .description {
        max-width: 560px;
        margin: 18px auto 0;
        color: #52616b;
        font-size: clamp(16px, 3vw, 18px);
        line-height: 1.8;
      }

      .address-change {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
        align-items: center;
        gap: 14px;
        margin: 32px 0;
      }

      .address {
        min-width: 0;
        padding: 15px 14px;
        border-radius: 14px;
        background: #f4f7f6;
        color: #64748b;
        font-size: 13px;
        font-weight: 700;
        overflow-wrap: anywhere;
      }

      .address.new {
        border: 1px solid #99f6e4;
        background: #f0fdfa;
        color: #0f766e;
      }

      .arrow {
        color: #0d9488;
        font-size: 24px;
        font-weight: 800;
      }

      .primary-link {
        min-height: 54px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 14px 28px;
        border-radius: 14px;
        background: linear-gradient(135deg, #0d9488, #0f766e);
        box-shadow: 0 14px 28px rgba(15, 118, 110, 0.24);
        color: #fff;
        font-size: 17px;
        font-weight: 800;
        text-decoration: none;
        transition: transform 160ms ease, box-shadow 160ms ease;
      }

      .primary-link:hover {
        transform: translateY(-2px);
        box-shadow: 0 18px 34px rgba(15, 118, 110, 0.3);
      }

      .primary-link:focus-visible {
        outline: 4px solid rgba(20, 184, 166, 0.25);
        outline-offset: 4px;
      }

      .link-icon {
        font-size: 21px;
        line-height: 1;
      }

      .note {
        margin: 24px 0 0;
        color: #7a8790;
        font-size: 13px;
        line-height: 1.7;
      }

      @media (max-width: 560px) {
        main {
          padding: 18px 14px;
        }

        .card {
          padding: 34px 22px;
          border-radius: 22px;
        }

        .brand {
          margin-bottom: 26px;
        }

        .address-change {
          grid-template-columns: 1fr;
          gap: 8px;
          margin: 26px 0;
        }

        .arrow {
          transform: rotate(90deg);
        }

        .primary-link {
          width: 100%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .primary-link {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card" aria-labelledby="page-title">
        <div class="brand">
          <img
            src="https://app.nutalig.com/logo_nutalig.jpg"
            alt="Nutalig"
            width="150"
            height="150"
          />
        </div>

        <div class="status">ประกาศย้ายระบบ</div>
        <h1 id="page-title">เราย้ายไปยังระบบใหม่แล้ว</h1>
        <p class="description">
          ระบบ Nutalig ได้ย้ายที่อยู่เพื่อมอบประสบการณ์การใช้งานที่ดียิ่งขึ้น
          กรุณาเข้าใช้งานผ่านเว็บไซต์ใหม่ด้านล่าง
        </p>

        <div class="address-change" aria-label="ที่อยู่เว็บไซต์เดิมและเว็บไซต์ใหม่">
          <div class="address">nutalig.tk-rubsub.online</div>
          <div class="arrow" aria-hidden="true">→</div>
          <div class="address new">app.nutalig.com</div>
        </div>

        <a class="primary-link" href="https://app.nutalig.com/">
          <span>ไปยังระบบใหม่</span>
          <span class="link-icon" aria-hidden="true">→</span>
        </a>

        <p class="note">
          แนะนำให้บันทึกเว็บไซต์ใหม่ไว้ใน Bookmark เพื่อความสะดวกในการเข้าใช้งานครั้งถัดไป
        </p>
      </section>
    </main>
  </body>
</html>
